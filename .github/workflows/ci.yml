name: Module CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.1"

      - name: Check formatting
        run: terraform fmt -check -recursive .

      - name: Initialize module
        run: terraform init -backend=false -input=false

      - name: Validate module
        run: terraform validate

      - name: Test module
        run: terraform test

      - name: Initialize example
        run: terraform -chdir=examples/basic init -backend=false -input=false

      - name: Validate example
        run: terraform -chdir=examples/basic validate

  opentofu:
    name: OpenTofu
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.12.6"

      - name: Check formatting
        run: tofu fmt -check -recursive .

      - name: Initialize module
        run: tofu init -backend=false -input=false

      - name: Validate module
        run: tofu validate

      - name: Test module
        run: tofu test

      - name: Initialize example
        run: tofu -chdir=examples/basic init -backend=false -input=false

      - name: Validate example
        run: tofu -chdir=examples/basic validate
